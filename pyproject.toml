[project]
name = "devinci-terminal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "crewai",
    "pydantic-settings>=2.15.0",
    "pytest-async>=0.1.1",
    "pytest-asyncio>=1.4.0",
    "crewai[anthropic]",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-n auto --dist loadscope"
